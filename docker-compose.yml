services:
  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  api:
    build: ./apps/api
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      MONGO_URL: mongodb://mongo:27017/relay
      JWT_SECRET: dev-only-change-me
    depends_on:
      - mongo

volumes:
  mongo_data:
